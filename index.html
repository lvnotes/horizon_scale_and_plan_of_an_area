<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Завдання: горизонт, план і масштаб</title>
<style>
:root{--ink:#1d3b40;--bg:#e4f1f6;--line:#b9d6de;--teal:#1b7f8c;--ok:#2e9e57;--okbg:#d9f4e3;--bad:#d64545;--badbg:#fde1e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Trebuchet MS","Segoe UI",Verdana,sans-serif;padding:16px}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 2px}
.sub{margin:0 0 14px;color:#4b6d73;font-size:.9rem}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px}
.num{font-size:.9rem;color:#4b6d73}
.dots{display:flex;gap:5px;margin:8px 0 16px}
.dots i{flex:1;height:10px;border-radius:5px;background:#dbe8ec}
.dots .cur{background:var(--teal)}.dots .ok{background:var(--ok)}.dots .bad{background:var(--bad)}
.q{font-size:1.15rem;font-weight:bold;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#f4fafc;border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.sel{border-color:var(--teal);background:#d6edf2}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#14602f;font-weight:bold}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:#8f1f1f;font-weight:bold}
.opt:disabled{cursor:default}
.pair{display:grid;grid-template-columns:150px 1fr;gap:10px}
.pair.s{grid-template-columns:90px 1fr}
.sg img{display:block;width:100%;height:auto;border-radius:6px}
.sg{display:flex;justify-content:center;padding:6px}
.sg svg{display:block}
.hit{cursor:pointer}
svg.big{display:block;margin:0 auto 10px;max-width:100%;border:2px solid var(--line);border-radius:10px;background:#fff}
input{font:inherit;width:110px;padding:10px;border:2px solid var(--line);border-radius:10px}
input.ok{border-color:var(--ok);background:var(--okbg)}input.bad{border-color:var(--bad);background:var(--badbg)}
.fb{min-height:1.5em;margin:6px 0 12px;font-size:.95rem}
.fb.ok{color:#14602f}.fb.bad{color:#8f1f1f}
.btn{font:inherit;font-weight:bold;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
.btn:hover{background:#15666f}
.hide{display:none}
.res{text-align:center}
.score{font-size:3rem;font-weight:bold;margin:4px 0}.score span{color:var(--ok)}
.stars{font-size:2rem;letter-spacing:4px}
.row{display:flex;justify-content:space-between;padding:8px 12px;margin:6px 0;border-radius:8px;background:#f4fafc;text-align:left}
.g{color:#14602f}.r{color:#8f1f1f}
.miss div{background:var(--badbg);border-left:6px solid var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:.95rem;text-align:left}
.letter{line-height:1.6}
.bl{display:inline-block;text-align:center;vertical-align:middle;margin:6px 4px;line-height:1.2}
.sgn svg{width:62px;display:block;margin:0 auto 3px}
select{font:inherit;font-size:.8rem;max-width:132px;padding:3px;border:2px solid var(--line);border-radius:8px}
select.ok{border-color:var(--ok);background:var(--okbg)}select.bad{border-color:var(--bad);background:var(--badbg)}
.bl small{display:block;color:#8f1f1f;font-size:.75rem;max-width:132px}
</style>
</head>
<body>
<div class="wrap">
<h1>Горизонт, план місцевості та масштаб</h1>
<p class="sub">Природа · 4 клас · тести та інтерактивні завдання</p>
<div class="card" id="app"></div>
</div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=0|Math.random()*(k+1);[a[k],a[j]]=[a[j],a[k]]}return a};
const btn=(t,c,f)=>{const b=document.createElement('button');b.className=c;b.innerHTML=t;b.onclick=()=>f(b);return b};

// 1. Тест (перша відповідь — правильна)
const TEST=[
["Що таке горизонт?","Частина земної поверхні, яку людина бачить навколо себе на відкритій місцевості","Прилад для визначення сторін горизонту","Креслення місцевості зверху"],
["Де добре видно горизонт і лінію горизонту?","На відкритій місцевості, де немає лісу, гір, будинків","У густому лісі","Між високими будинками"],
["На якій відстані доросла людина може побачити лінію горизонту на відкритій місцевості?","Майже 5 км","Майже 50 м","Майже 500 км"],
["Що відбувається, коли підніматися над поверхнею Землі?","Горизонт стає ширшим, а лінія горизонту віддаляється","Горизонт стає вужчим","Лінія горизонту наближається"],
["Скільки основних сторін горизонту розрізняють?","Чотири","Дві","Шість"],
["Що знаходиться між півднем і заходом?","Південний захід (Пд. Зх.)","Північний захід (Пн. Зх.)","Південний схід (Пд. Сх.)"],
["План — це…","точне креслення вигляду предметів зверху","малюнок предмета збоку","фотографія місцевості"],
["Масштаб — це…","міра зменшення відстаней на місцевості під час зображення їх на плані","прилад для визначення сторін горизонту","умовний знак на плані"],
["Стіл завдовжки 120 см зменшили на плані у 40 разів. Яка довжина стола на плані?","3 см","4 см","30 см"],
["Масштаб записано так: 1 см — 40 см. Що це означає?","1 см на плані відповідає 40 см дійсних розмірів","1 см на місцевості відповідає 40 см на плані","Усі розміри збільшено у 40 разів"],
["Відстань між столами 160 см, масштаб 1 см — 40 см. Яка відстань між столами на плані?","4 см","3 см","160 см"],
["Стрілку Пн.—Пд. на плані не показано. Який край плану вважають північним?","Верхній","Нижній","Лівий"],
["Хто користується планами місцевості?","Геологи, будівельники, агрономи, туристи","Тільки художники","Тільки лікарі"],
["Учні посперечалися: що буде, якщо піднятися на гору? З ким ти погодишся?","З Ванею: стане більше видно навколо","З Кірою: огляд не зміниться","З Андрієм: стане менше видно навколо"]
];
const tRounds=()=>sh(TEST).slice(0,6).map(a=>({miss:a[0]+' — '+a[1],build(box,done){
 box.innerHTML='<p class="q">'+a[0]+'</p>';
 const bs=sh(a.slice(1)).map(t=>btn(t,'opt',b=>{bs.forEach(x=>{x.disabled=true;if(x.textContent===a[1])x.classList.add('ok')});if(t!==a[1])b.classList.add('bad');done(t===a[1]?1:0,1)}));
 bs.forEach(b=>box.append(b))}}));

// 2. Роза сторін горизонту
const DIR=['Пн.','Пн. Сх.','Сх.','Пд. Сх.','Пд.','Пд. Зх.','Зх.','Пн. Зх.'];
const FULL=['північ','північний схід','схід','південний схід','південь','південний захід','захід','північний захід'];
const pt=(r,a)=>(130+r*Math.sin(a*Math.PI/180)).toFixed(1)+','+(130-r*Math.cos(a*Math.PI/180)).toFixed(1);
const STAR=[...Array(16).keys()].map(j=>pt(j%4==0?80:j%4==2?52:16,j*22.5)).join(' ');
const roseRounds=()=>sh([1,2,3,4,5,6,7]).slice(0,4).map(k=>({miss:'Де на розі сторін горизонту '+FULL[k]+' ('+DIR[k]+')?',build(box,done){
 let s='<p class="q">Знайди на розі сторін горизонту: <u>'+FULL[k]+'</u></p><svg class="big" viewBox="0 0 260 260" width="300"><circle cx="130" cy="130" r="92" fill="#fff" stroke="#333" stroke-width="1.5"/><polygon points="'+STAR+'" fill="#e8a33d" stroke="#8a5a10"/><circle cx="130" cy="130" r="3" fill="#222"/>';
 for(let i=0;i<8;i++){const [x,y]=pt(108,i*45).split(',');s+='<g class="'+(i?'hit':'')+'" data-i="'+i+'"><circle cx="'+x+'" cy="'+y+'" r="17" fill="#fff" stroke="#1b7f8c" stroke-width="2"/><text x="'+x+'" y="'+(+y+3.5)+'" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d3b40">'+(i?'?':DIR[0])+'</text></g>'}
 box.innerHTML=s+'</svg>';
 box.querySelectorAll('g.hit').forEach(g=>g.onclick=()=>{const i=+g.dataset.i,ok=i==k;
  box.querySelectorAll('g').forEach(h=>{const n=+h.dataset.i;h.classList.remove('hit');h.querySelector('text').textContent=DIR[n];
   if(n==k||n==i&&!ok){h.querySelector('circle').setAttribute('fill',n==k?'#d9f4e3':'#fde1e1');h.querySelector('circle').setAttribute('stroke',n==k?'#2e9e57':'#d64545')}});
  done(ok?1:0,1,ok?'':'Це '+FULL[i]+'. '+FULL[k][0].toUpperCase()+FULL[k].slice(1)+' — '+DIR[k]+'.')})}}));

// 3. Умовні знаки й об’єкти (мал. 11): фото та знаки з підручника

const matchRound=k=>({miss:k?'Умовні знаки з мал. 11: зʼєднай знак і назву':'Об’єкти з мал. 11: зʼєднай фото і назву',build(box,done){
 const it=sh(OBJ).slice(0,5);let sel=null,bad=0,ok=0;
 box.innerHTML='<p class="q">'+(k?'Зʼєднай умовний знак із назвою':'Зʼєднай фото об’єкта з назвою')+': натисни на картинку, потім на назву.</p><div class="pair'+(k?' s':'')+'"><div id="L"></div><div id="R"></div></div>';
 const lb=it.map(a=>{const b=btn('<img src="'+a[k+1]+'" alt="">','opt sg',()=>{if(b.disabled)return;lb.forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel')});b.k=a[0];return b});
 const rb=sh(it).map(a=>{const b=btn(a[0],'opt',()=>{if(!sel||b.disabled)return;const s=sel;sel=null;
  if(s.k===b.k){[s,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});if(++ok==5)done(Math.max(0,5-bad),5,bad?'Помилок: '+bad+'.':'Без жодної помилки!')}
  else{bad++;[s,b].forEach(x=>x.classList.add('bad'));setTimeout(()=>[s,b].forEach(x=>x.classList.remove('bad','sel')),700)}});b.k=a[0];return b});
 lb.forEach(b=>$('#L').append(b));rb.forEach(b=>$('#R').append(b))}});

const F=(bg,inner)=>'<svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="1" y="1" width="78" height="54" fill="'+bg+'" stroke="#555" stroke-width="2"/>'+inner+'</svg>';
const grid=(f,cols,rows,x0,y0,dx,dy)=>{let t='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)t+=f(x0+c*dx,y0+r*dy);return t};
const LS={city:F('#e4503c','<path d="M0 14H80M0 30H80M0 44H80M18 0V56M40 0V56M60 0V56" stroke="#fff" stroke-width="2.5"/><rect x="4" y="4" width="5" height="4" fill="#222"/><rect x="8" y="6" width="6" height="4" fill="#222"/><rect x="4" y="18" width="5" height="4" fill="#222"/><rect x="8" y="22" width="6" height="4" fill="#222"/><rect x="4" y="34" width="5" height="4" fill="#222"/><rect x="8" y="36" width="6" height="4" fill="#222"/><rect x="4" y="48" width="5" height="4" fill="#222"/><rect x="22" y="4" width="5" height="4" fill="#222"/><rect x="30" y="6" width="6" height="4" fill="#222"/><rect x="23" y="7" width="4" height="3" fill="#222"/><rect x="22" y="18" width="5" height="4" fill="#222"/><rect x="30" y="22" width="6" height="4" fill="#222"/><rect x="23" y="23" width="4" height="3" fill="#222"/><rect x="22" y="34" width="5" height="4" fill="#222"/><rect x="30" y="36" width="6" height="4" fill="#222"/><rect x="23" y="37" width="4" height="3" fill="#222"/><rect x="22" y="48" width="5" height="4" fill="#222"/><rect x="44" y="4" width="5" height="4" fill="#222"/><rect x="50" y="6" width="6" height="4" fill="#222"/><rect x="45" y="7" width="4" height="3" fill="#222"/><rect x="44" y="18" width="5" height="4" fill="#222"/><rect x="50" y="22" width="6" height="4" fill="#222"/><rect x="45" y="23" width="4" height="3" fill="#222"/><rect x="44" y="34" width="5" height="4" fill="#222"/><rect x="50" y="36" width="6" height="4" fill="#222"/><rect x="45" y="37" width="4" height="3" fill="#222"/><rect x="44" y="48" width="5" height="4" fill="#222"/><rect x="64" y="4" width="5" height="4" fill="#222"/><rect x="70" y="6" width="6" height="4" fill="#222"/><rect x="65" y="7" width="4" height="3" fill="#222"/><rect x="64" y="18" width="5" height="4" fill="#222"/><rect x="70" y="22" width="6" height="4" fill="#222"/><rect x="65" y="23" width="4" height="3" fill="#222"/><rect x="64" y="34" width="5" height="4" fill="#222"/><rect x="70" y="36" width="6" height="4" fill="#222"/><rect x="65" y="37" width="4" height="3" fill="#222"/><rect x="64" y="48" width="5" height="4" fill="#222"/>'),forest:F('#2f9e44','<path d="M22 8L12 22M22 8L32 22M22 18L10 34M22 18L34 34M22 30L8 46M22 30L36 46M22 8V50" stroke="#222" stroke-width="1.6" fill="none"/><path d="M56 9C51 9 51 16 54 18C48 20 47 33 56 34C65 33 64 20 58 18C61 16 61 9 56 9Z" fill="#fff"/><path d="M56 34V44H62" stroke="#222" stroke-width="1.8" fill="none"/>'),road:F('#fff','<path d="M0 44L80 14" stroke="#e0a020" stroke-width="4"/>'),meadow:F('#9bd677',grid((x,y)=>'<path d="M'+x+' '+y+'v7M'+(x+4)+' '+y+'v7" stroke="#2f6b2a" stroke-width="1.5"/>',5,3,8,8,15,15)),path:F('#fff','<path d="M0 18Q30 14 44 32T80 44" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="5 3"/>'),lake:F('#fff','<path d="M18 30C14 14 36 8 50 14C66 20 66 42 48 46C32 50 20 44 18 30Z" fill="#2b8fd6" stroke="#1b5fa0" stroke-width="2"/>'),garden:F('#cfe8a4',grid((x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="#fff" stroke="#3b7a2a"/>',6,4,12,10,12,12))};
const LN={city:'Місто',forest:'Мішані ліси',road:'Ґрунтова дорога',meadow:'Луки',path:'Стежка',lake:'Озеро',garden:'Фруктовий сад'};
const LX=['Річка','Шосе','Хвойний ліс'];
const LET=['Дорогі друзі! Недалеко від нашого ','city',' росте ','forest','. На екскурсію до лісу спочатку ми йшли ','road','. Ліворуч розкинулися ','forest',', а праворуч — ','meadow','. Потім ми ступили на широку ','path',', яка пролягала через ','forest','. У лісі ми рухалися вузенькою ','path',' і дійшли до ','lake','. Під час подорожі ми вивчали рослини ','meadow',', ','garden',', ','forest','. Спостерігали за тваринами, які нам зустрічалися по дорозі. У ','forest',' обгородили мурашник, а на березі ','lake',' посадили кущики верболозу, щоб не руйнувався берег.'];
const letterRound=[{miss:'Лист із умовними знаками (с. 63): добери назви до знаків',build(box,done){
 const names=sh(Object.values(LN).concat(LX));
 box.innerHTML='<p class="q">Прочитай лист: до кожного умовного знака обери назву.</p><div class="letter">'+LET.map(t=>LN[t]?'<span class="bl"><span class="sgn">'+LS[t]+'</span><select data-k="'+t+'" aria-label="Назва знака"><option value="">?</option>'+names.map(n=>'<option>'+n+'</option>').join('')+'</select></span>':t).join('')+'</div><p><button class="btn" id="lk">Перевірити</button></p>';
 $('#lk').onclick=()=>{const ss=[...box.querySelectorAll('select')];if(ss.some(x=>!x.value)){$('#fb').className='fb bad';$('#fb').textContent='Обери назву для кожного знака.';return}
  let c=0;ss.forEach(x=>{x.disabled=true;const ok=x.value===LN[x.dataset.k];if(ok)c++;x.className=ok?'ok':'bad';if(!ok)x.insertAdjacentHTML('afterend','<small>'+LN[x.dataset.k]+'</small>')});
  $('#lk').disabled=true;done(Math.round(5*c/ss.length),5,'Правильно розшифровано знаків: '+c+' із '+ss.length+'.')}}}];

// 5. Масштаб
const SC=[[10,'см'],[40,'см'],[25,'м'],[300,'м'],[400,'м']];
const scaleRounds=()=>[0,1,0,1].map(t=>{const [v,u]=sh(SC)[0],n=2+(0|Math.random()*5),real=n*v,ans=t?n:real,au=t?'см':u;
 const q=t?'На місцевості відстань між об’єктами — '+real+' '+u+'. Масштаб: 1 см — '+v+' '+u+'. Скільки сантиметрів буде на плані?':'На плані відстань між об’єктами — '+n+' см. Масштаб: 1 см — '+v+' '+u+'. Яка справжня відстань на місцевості?';
 const how=t?real+' '+u+' : '+v+' '+u+' = '+n+' см':v+' '+u+' · '+n+' = '+real+' '+u;
 return {miss:q+' Відповідь: '+ans+' '+au,build(box,done){
  box.innerHTML='<p class="q">'+q+'</p><input type="number" inputmode="numeric" id="in" aria-label="Відповідь"> <b>'+au+'</b> <button class="btn" id="ck">Перевірити</button>';
  const i=$('#in'),go=()=>{if(i.value==='')return;const ok=+i.value===ans;i.disabled=true;$('#ck').disabled=true;i.className=ok?'ok':'bad';done(ok?1:0,1,(ok?'':'Правильно: ')+how+'.')};
  $('#ck').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};i.focus()}}});

// 6. План місцевості
const sg=(v,x,y,w)=>v.replace('<svg ','<svg x="'+x+'" y="'+y+'" width="'+w+'" height="'+(w*0.7)+'" ');
const PS={village:F('#e4503c','<path d="M0 17H80M0 41H80M14 0V56M66 0V56M40 0V17M40 41V56" stroke="#fff" stroke-width="2.5"/><rect x="28" y="15" width="24" height="26" fill="#fff"/><path d="M37.5 19h5v5h5v5h-5v8h-5v-8h-5v-5h5z" fill="#555"/><rect x="4" y="5" width="5" height="4" fill="#222"/><rect x="20" y="4" width="6" height="4" fill="#222"/><rect x="28" y="9" width="4" height="3" fill="#222"/><rect x="46" y="5" width="5" height="4" fill="#222"/><rect x="56" y="10" width="5" height="3" fill="#222"/><rect x="70" y="5" width="5" height="4" fill="#222"/><rect x="4" y="26" width="5" height="4" fill="#222"/><rect x="18" y="24" width="5" height="4" fill="#222"/><rect x="18" y="32" width="4" height="3" fill="#222"/><rect x="56" y="24" width="5" height="4" fill="#222"/><rect x="57" y="32" width="4" height="3" fill="#222"/><rect x="70" y="28" width="5" height="4" fill="#222"/><rect x="4" y="46" width="5" height="4" fill="#222"/><rect x="20" y="45" width="6" height="4" fill="#222"/><rect x="30" y="49" width="4" height="3" fill="#222"/><rect x="46" y="45" width="5" height="4" fill="#222"/><rect x="55" y="49" width="5" height="3" fill="#222"/><rect x="70" y="46" width="5" height="4" fill="#222"/>'),forest:F('#2f9e44','<ellipse cx="40" cy="22" rx="13" ry="14" fill="#fff"/><path d="M40 36V48" stroke="#fff" stroke-width="3"/>'),field:F('#d2ad66','<rect x="3" y="3" width="22" height="18" fill="#fff" stroke="#555"/><text x="14" y="17" font-size="15" text-anchor="middle" fill="#222" font-family="Arial">П</text>')};
const OB=[
['Озеро',sg(LS.lake,108,4,84),150,74],
['Ліс',sg(PS.forest,224,70,66),257,132],
['Луки',sg(LS.meadow,115,146,70),150,208],
['Поле',sg(PS.field,10,70,66),43,132]
];
const SIDE=['півночі','сході','півдні','заході'];
const planRounds=()=>sh([0,1,2,3]).slice(0,3).map(k=>({miss:'Що розташовано на '+SIDE[k]+' від села? — '+OB[k][0],build(box,done){
 let s='<p class="q">Що розташовано на <u>'+SIDE[k]+'</u> від села? Натисни на об’єкт.</p><svg class="big" viewBox="0 0 300 216" width="420">'+sg(PS.village,118,80,64)+'<text x="150" y="141" text-anchor="middle" font-size="12" fill="#1d3b40">село</text><path d="M262 54V16" stroke="#222" stroke-width="2"/><path d="M256 24L262 10L268 24Z" fill="#222"/><text x="262" y="66" text-anchor="middle" font-size="11" font-weight="bold">Пн.</text>';
 OB.forEach((o,i)=>s+='<g class="hit" data-i="'+i+'">'+o[1]+'<text x="'+o[2]+'" y="'+o[3]+'" text-anchor="middle" font-size="12" fill="#1d3b40">'+o[0]+'</text></g>');
 box.innerHTML=s+'</svg>';
 const mark=(g,c)=>{const b=g.getBBox(),r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',b.x-3);r.setAttribute('y',b.y-3);r.setAttribute('width',b.width+6);r.setAttribute('height',b.height+6);r.setAttribute('fill','none');r.setAttribute('stroke',c);r.setAttribute('stroke-width',4);g.append(r)};
 const gs=[...box.querySelectorAll('g.hit')];
 gs.forEach(g=>g.onclick=()=>{const i=+g.dataset.i,ok=i==k;gs.forEach(h=>h.classList.remove('hit'));mark(gs[k],'#2e9e57');if(!ok)mark(g,'#d64545');done(ok?1:0,1,ok?'':'Це '+OB[k][0].toLowerCase()+' — воно розташоване на '+SIDE[k]+'.')})}}));

const SECS=[['Тест',tRounds],['Роза сторін горизонту',roseRounds],['Умовні знаки й об’єкти',()=>[matchRound(0),matchRound(1)]],['Розшифруй лист',()=>letterRound],['Масштаб',scaleRounds],['План місцевості',planRounds]];
let res,miss;
function run(si){
 const [title,mk]=SECS[si],rs=mk();let r=0,p=0,m=0,marks=[];
 const show=()=>{
  app.innerHTML='<div class="num">Завдання '+(si+1)+' з '+SECS.length+' · '+title+'</div><div class="dots">'+rs.map((_,k)=>'<i class="'+(k<marks.length?(marks[k]?'ok':'bad'):k==r?'cur':'')+'"></i>').join('')+'</div><div id="box"></div><div class="fb" id="fb" aria-live="polite"></div><button class="btn hide" id="nx"></button>';
  const rd=rs[r];
  rd.build($('#box'),(a,b,msg)=>{p+=a;m+=b;marks.push(a==b);if(a<b)miss.push(rd.miss);
   const f=$('#fb');f.className='fb '+(a==b?'ok':'bad');f.textContent=(a==b?'Правильно! ':'Не зовсім. ')+(msg||'');
   const n=$('#nx');n.className='btn';n.textContent=r+1<rs.length?'Далі':(si+1<SECS.length?'До наступного завдання':'Показати результат');
   n.onclick=()=>{r++;if(r<rs.length)show();else{res.push([title,p,m]);si+1<SECS.length?run(si+1):end()}};n.focus()})};
 show()}
function end(){
 const P=res.reduce((a,x)=>a+x[1],0),M=res.reduce((a,x)=>a+x[2],0),q=P/M;
 const t=q>=.9?['Чудово! Ти справжній мандрівник-дослідник!','★★★']:q>=.7?['Добре! Ти добре орієнтуєшся на місцевості.','★★☆']:q>=.5?['Непогано, але є над чим попрацювати.','★☆☆']:['Перечитай параграф і спробуй ще раз — усе вийде!','☆☆☆'];
 app.innerHTML='<div class="res"><div class="stars">'+t[1]+'</div><div class="score"><span>'+P+'</span> / '+M+'</div><h2>'+t[0]+'</h2></div>'
 +res.map(x=>'<div class="row"><span>'+x[0]+'</span><b class="'+(x[1]==x[2]?'g':'r')+'">'+x[1]+' / '+x[2]+'</b></div>').join('')
 +(miss.length?'<div class="miss"><p><b>Повтори:</b></p>'+[...new Set(miss)].map(x=>'<div>'+x+'</div>').join('')+'</div>':'<p class="g"><b>Жодної помилки — відмінний результат!</b></p>')
 +'<div class="res"><button class="btn" id="again">Пройти ще раз (нові завдання)</button></div>';
 $('#again').onclick=start}
function start(){res=[];miss=[];run(0)}
start();
</script>
